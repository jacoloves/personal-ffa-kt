# =============================================================================
# gradle.properties
# 役割: Gradle の実行時設定(JVM 引数・キャッシュ・コードスタイル)を宣言する。
# =============================================================================

# Gradle デーモン用 JVM 引数。Kotlin/JS のコンパイルはメモリを食うので余裕を持たせる。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Kotlin のコードスタイルを公式規約(official)に固定する。IDE のフォーマット基準になる。
kotlin.code.style=official

# ビルドキャッシュ: 入力が同じタスクの出力を再利用し、2回目以降のビルドを高速化する。
org.gradle.caching=true

# コンフィギュレーションキャッシュ: 設定フェーズ結果を保存して再利用する。
org.gradle.configuration-cache=true
