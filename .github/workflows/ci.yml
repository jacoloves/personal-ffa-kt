# =============================================================================
# ci.yml
# 役割: PR と main への push で ./gradlew check を実行し、壊れたコードがマージされるのを防ぐ。
# =============================================================================
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read # 最小権限: コードを読むだけ
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21" # LTS 版。Gradle と Kotlin の実行に使う
      - uses: gradle/actions/setup-gradle@v6 # Gradle のキャッシュと Wrapper の検証を行う
      - run: ./gradlew check --no-daemon
