<!DOCTYPE html>
<!--
  index.html
  役割: ブラウザが最初に読み込むページ。Compose HTML の描画先(#root)と、
        webpack が生成する app.js の読み込みだけを行う最小の HTML。
-->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマートフォンでも幅に合わせて表示するための設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal FFA</title>
    <!-- ファビコン: SVG をデータ URI で埋め込む(別ファイルを置かず /favicon.ico への 404 を防ぐ)。ダーク背景に映える剣のシルエット -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312131a'/%3E%3Cpath d='M16 4l3 3-1 12h-4L13 7z' fill='%237aa2ff'/%3E%3Crect x='9' y='19' width='14' height='3' rx='1.5' fill='%23e6c35c'/%3E%3Crect x='14.5' y='22' width='3' height='6' rx='1' fill='%23e6c35c'/%3E%3C/svg%3E">
    <style>
        /* 余白を消し、背景をダークにして読み込み中のチラつきを防ぐ */
        body { margin: 0; background: #12131a; }
    </style>
</head>
<body>
    <!-- Compose HTML の描画先 -->
    <div id="root"></div>
    <!-- ui/build.gradle.kts の outputFileName と一致させる -->
    <script src="app.js"></script>
</body>
</html>
